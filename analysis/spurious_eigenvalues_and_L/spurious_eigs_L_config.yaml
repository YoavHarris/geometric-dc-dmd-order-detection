# Configuration for spurious eigenvalue magnitude vs L experiment
# This experiment collects spurious eigenvalue magnitudes for different embedding lengths L

system:
  spatial_dim: 50
  num_timesteps: 200
  num_modes: 3
  max_rank: 7

  # Sample size control mode (how N changes with L), to counter variance growing due to less samples.
  # - fixed_N: Keep total timesteps N constant
  # - fixed_N_cols: Keep effective samples N_cols = N - L constant
  # - fixed_N_cols_over_DL: Keep oversampling ratio N_cols/(D·L) constant
  sample_size_mode: fixed_N_cols

signal:
  eigenvalue_magnitude: 0.99
  frequency_separation: 0.02
  snr_db: 40.0
  top_amplitude: 1.0
  noise_mode: gaussian
  force_mode_orthogonality: true

experiment:
  L_values: [2, 12, 22, 32, 42, 52, 62, 72, 82, 92, 102, 112, 122]
  n_mc_iterations: 2000
  base_random_seed: 196

output:
  save_csv: true
  output_dir: 'C:\Users\Yoav\dcdmd_experiments\spurious_eigenvalues_L_251125'
  csv_filename: 'fixed_N_cols_results.csv'

plotting:
  # Data and style paths
  data_csv_path: 'C:\Users\Yoav\dcdmd_experiments\spurious_eigenvalues_L_251125\spurious_eigs_L_results.csv'
  mplstyle_path: '..\figures\mplstyle_files\chaos_single.mplstyle'

  # X-axis limits for CDF and PDF plots
  xlim: [0.85, 1.02]
  
  # Subset of L values for appendix comparison plots
  # If not provided, defaults to [min, median, max]
  L_subset: [2, 22, 62, 122]

  # KDE/PDF parameters
  kde:
    x_eval_points: 500
    bandwidth: scott

  # Minimum eigenvalue statistics (mixture-only plot)
  min_stats:
    interval_percentiles: [5, 95]
    show_mean: true

  # Color scheme
  colors:
    colormap: viridis
  
  # Settings comparison configuration
  compare_settings:
    enabled: true
    mixture_label: "Mixture (spurious)"
    noise_label: "Noise-only"
    overlay: true
