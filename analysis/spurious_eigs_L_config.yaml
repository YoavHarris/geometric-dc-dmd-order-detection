  # Configuration for spurious eigenvalue magnitude vs L experiment
# This experiment collects spurious eigenvalue magnitudes for different embedding lengths L
# System parameters (fixed)
system:
  spatial_dim: 100          # D: spatial dimension
  num_timesteps: 200       # N: number of timesteps (baseline for L_min)
  num_modes: 3             # m: number of true modes
  max_rank: 5             # M: DMD truncation rank (will get m true + M-m spurious)
  
  # Sample size control mode (how N changes with L)
  # - 'fixed_N': Keep total timesteps N constant (default, current behavior)
  # - 'fixed_N_cols': Keep effective samples N_cols = N - L constant
  # - 'fixed_N_cols_over_DL': Keep oversampling ratio N_cols/(D·L) constant
  sample_size_mode: 'fixed_N'

# Signal parameters (fixed)
signal:
  eigenvalue_magnitude: 0.99    # Base magnitude of eigenvalues (< 1 for stability)
  frequency_separation: 0.02    # Frequency separation between modes
  snr_db: 40.0                  # Signal-to-noise ratio in dB
  top_amplitude: 1.0            # Amplitude of the strongest mode
  noise_mode: gaussian          # Noise type: 'gaussian', 'uniform', 'student_t'
  force_mode_orthogonality: true  # Whether to force modes to be orthogonal


# Experiment parameters
experiment:
#  L_values: [  2,  12,  22,  32,  42,  52,  62,  72,  82,  92, 102, 112, 122]  # Embedding lengths to test
  L_values: [  5,  28,  51,  74,  97, 120]  # Embedding lengths to test
  n_mc_iterations: 200          # Number of Monte Carlo iterations per L
  base_random_seed: 196          # Base seed (actual seed = base + L*1000 + mc_iter)

# Output settings
output:
  save_csv: true
  output_dir: "spurious_eigenvalues_L"
  csv_filename: "spurious_eigs_L_results.csv"

