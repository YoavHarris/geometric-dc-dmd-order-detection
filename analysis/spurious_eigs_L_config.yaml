# Configuration for spurious eigenvalue magnitude vs L experiment
# This experiment collects spurious eigenvalue magnitudes for different embedding lengths L

# System parameters (fixed)
system:
  spatial_dim: 45          # D: spatial dimension
  num_timesteps: 200       # N: number of timesteps
  num_modes: 3             # m: number of true modes
  max_rank: 15             # M: DMD truncation rank (will get m true + M-m spurious)

# Signal parameters (fixed)
signal:
  eigenvalue_magnitude: 0.98    # Base magnitude of eigenvalues (< 1 for stability)
  frequency_separation: 0.01    # Frequency separation between modes
  snr_db: 10.0                  # Signal-to-noise ratio in dB
  top_amplitude: 1.0            # Amplitude of the strongest mode
  noise_mode: gaussian          # Noise type: 'gaussian', 'uniform', 'student_t'

# Experiment parameters
experiment:
  L_values: [5, 10, 15, 20, 25, 30, 40, 50, 65, 80, 100]  # Embedding lengths to test
  n_mc_iterations: 10          # Number of Monte Carlo iterations per L
  base_random_seed: 196          # Base seed (actual seed = base + L*1000 + mc_iter)

# Output settings
output:
  save_csv: true
  output_dir: "analysis"
  csv_filename: "spurious_eigs_L_results.csv"

