# ══════════════════════════════════════════════════════════════════════════════
# PBS Experiment Configuration Template
# NOTE: You must replace all instances of 'REQUIRED_USER_INPUT' with your
# specific environment settings before running this experiment.
# ══════════════════════════════════════════════════════════════════════════════

experiment:
  base_random_seed: 196  # Base seed for reproducibility; each job gets base + job_id*1000

# ──────────────────────────────────────────────────────────────────────────────
# Methods to evaluate (comment out to disable)
# ──────────────────────────────────────────────────────────────────────────────
methods:
  - BIC
  - GAP
  - ExactModeNorm
  - STC
  - ESR-Energy
  - NestedDMD
  - FixedEigenvalueKVFit
  # Combination methods (merge features before clustering):
  - NestedDMD+ESR            # Combines NestedDMD features with ESR-Energy
  - FixedEigenvalueKVFit+ESR # Combines FixedEigenvalueKVFit features with ESR-Energy

# ──────────────────────────────────────────────────────────────────────────────
# Clustering configuration (shared by all clustering-based methods)
# ──────────────────────────────────────────────────────────────────────────────
clustering:
  algorithm: gmm        # Options: gmm, kmeans
  strategy: mean         # Options: mean, distance
  normalization: min_max  # Options: min_max, standard, null

# ──────────────────────────────────────────────────────────────────────────────
# Parameter Sweep Configuration
# ──────────────────────────────────────────────────────────────────────────────
generator:
  working_point:
    snr_db: 10.0
    freq_sep: 0.01
    eig_mag: 0.9775
    eig_mag_spread: 0.0
    delays_over_timesteps: 0.32
    spatial_dim: 45
    temporal_dim: 200
    top_amplitude: 1.0
    max_rank: 15
    num_modes: 3
    noise_mode: "gaussian"

parameters:
  max_rank:
    type: list  
    role: wp
    values: [4, 14, 24, 34, 44, 54, 64, 74, 84, 94, 104, 110, 114, 116, 118, 120, 122, 124, 126, 128, 130, 132, 134, 136]
    as_int: true

# ──────────────────────────────────────────────────────────────────────────────
# Static Arguments (constant across all jobs)
# ──────────────────────────────────────────────────────────────────────────────
static_args:
  n_iter: 500
  dt: 1.0
  rho_mode: random
  eig_mag_spread: 0.0
  artificial_damping: 1.0


# ──────────────────────────────────────────────────────────────────────────────
# PBS Configuration
# ──────────────────────────────────────────────────────────────────────────────
pbs:
  queue: zeus_comb_short
  mem: 1000MB
  ncpus: 1
  mpiprocs: 1
  walltime: "03:00:00"

# ──────────────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────────────
paths:
  interpreter: /home/yoav.h/miniconda/envs/zeus-dmd/bin/python3.11
  code_dir: /home/yoav.h/dcdmd_11_25/dc-dmd-order-detection
  worker_script: pbs_experimenting/run_single_job.py

# ──────────────────────────────────────────────────────────────────────────────
# Output Configuration
# ──────────────────────────────────────────────────────────────────────────────
output:
  output_dir: /home/yoav.h/dcdmd_11_25/final_paper_runs/max_rank
