# ══════════════════════════════════════════════════════════════════════════════
# PBS Experiment Configuration Template
# NOTE: You must replace all instances of 'REQUIRED_USER_INPUT' with your
# specific environment settings before running this experiment.
# ══════════════════════════════════════════════════════════════════════════════

experiment:
  base_random_seed: 196  # Base seed for reproducibility; each job gets base + job_id*1000

# ──────────────────────────────────────────────────────────────────────────────
# Methods to evaluate (comment out to disable)
# ──────────────────────────────────────────────────────────────────────────────
methods:
  - BIC
  - GAP
  - ExactModeNorm
  - EigenvalueMagnitude
  - STC
  - ESR-Energy
  - NestedDMD
  - FixedEigenvalueKVFit
  # Combination methods (merge features before clustering):
  - NestedDMD+ESR            # Combines NestedDMD features with ESR-Energy
  - FixedEigenvalueKVFit+ESR # Combines FixedEigenvalueKVFit features with ESR-Energy

# ──────────────────────────────────────────────────────────────────────────────
# Clustering configuration (shared by all clustering-based methods)
# ──────────────────────────────────────────────────────────────────────────────
clustering:
  algorithm: gmm        # Options: gmm, kmeans
  strategy: mean         # Options: mean, distance
  normalization: min_max  # Options: min_max, standard, null

# ──────────────────────────────────────────────────────────────────────────────
# Parameter Sweep Configuration
# ──────────────────────────────────────────────────────────────────────────────
generator:
  working_point:
    snr_db: 10.0
    freq_sep: 0.01
    eig_mag: 0.98
    eig_mag_spread: 0.0
    delays_over_timesteps: 0.005
    spatial_dim: 220
    temporal_dim: 200
    top_amplitude: 1.0
    max_rank: 15

parameters:
  snr_db:
    type: range
    role: wp
    start: -10
    end: 20
    num_steps: 16
    scale: lin

  freq_sep:
    type: range
    role: wp
    start: 0.0005
    end: 0.025
    num_steps: 15
    scale: lin

  eig_mag:
    type: range
    role: wp
    start: 0.85
    end: 1.0
    num_steps: 16
    scale: lin

  spatial_dim:
    type: range
    role: wp
    start: 5
    end: 105
    num_steps: 11
    as_int: true

  top_amplitude:
    type: range
    role: wp
    start: 1.0
    end: 4.0
    num_steps: 13
    scale: lin

  num_modes:
    type: list
    role: cartesian
    values: [2, 3, 5]
    as_int: true

  max_rank:
    type: range
    role: wp
    start: 7
    end: 63
    num_steps: 8
    as_int: true

  noise_mode:
    type: list
    role: cartesian
    values: ["gaussian", "bi_gaussian", "hetero"]

# ──────────────────────────────────────────────────────────────────────────────
# Static Arguments (constant across all jobs)
# ──────────────────────────────────────────────────────────────────────────────
static_args:
  n_iter: 500
  dt: 1.0
  rho_mode: random
  eig_mag_spread: 0.0
  artificial_damping: 1.0
  delays_over_timesteps: 0.005



# ──────────────────────────────────────────────────────────────────────────────
# PBS Configuration
# ──────────────────────────────────────────────────────────────────────────────
pbs:
  queue: zeus_comb_short 
  mem: 1000MB
  ncpus: 1
  mpiprocs: 1
  walltime: "02:30:00"

# ──────────────────────────────────────────────────────────────────────────────
# Paths
# ──────────────────────────────────────────────────────────────────────────────
paths:
  interpreter: /home/yoav.h/miniconda/envs/zeus-dmd/bin/python3.11
  code_dir: /home/yoav.h/dcdmd_11_25/dc-dmd-order-detection
  worker_script: pbs_experimenting/run_single_job.py

# ──────────────────────────────────────────────────────────────────────────────
# Output Configuration
# ──────────────────────────────────────────────────────────────────────────────
output:
  output_dir: /home/yoav.h/dcdmd_11_25/final_paper_runs/no_dc
