[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-dmd-order-detection"
version = "0.1.0"
description = "Order detection methods for delay-coordinate DMD"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["algorithms*", "utils*", "figures*", "pbs_experimenting*", "analysis*"]
