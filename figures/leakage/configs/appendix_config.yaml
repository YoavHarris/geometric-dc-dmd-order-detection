project_root: "../../.."

plotting:
  mplstyle_path: "figures/mplstyle_files/chaos_double.mplstyle"
  
  rsln:
    version: "perturbed"  # "clean" | "perturbed"

  figure:
    type: "boxplot"
    annotate_gap_panel: null  # No gap annotation for appendix
    show_titles: false  # Remove panel titles

  scenarios:
    - name: "noisy"
      label: "Low SNR"
      csv_path: "figures/leakage/data/noisy_results.csv"
    
    - name: "overestimation"
      label: "Overestimation"
      csv_path: "figures/leakage/data/overestimation_results.csv"

output:
  output_dir: "figures/leakage/outputs"
  filename: "leakage_appendix.png"
