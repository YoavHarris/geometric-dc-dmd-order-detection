# Single scan: Max Rank (Delay Embedded)
# Uses style_mode: "single" for paper-width compliance

base:
  csv_path: figures/scans/data/paper_max_rank.csv.gz
  metric: order_hit_prob
  methods:
    - BIC
    - GAP
    - STC
    - ESR-Energy
    - NestedDMD
    - FixedEigenvalueKVFit

  show: false

# Working point for delay-embedded experiments
baseline_working_point:
  snr_db: 10.0
  freq_sep: 0.01
  eig_mag: 0.9775
  eig_mag_spread: 0.0
  delays_over_timesteps: 0.32
  spatial_dim: 45
  temporal_dim: 200
  rho_mode: random
  top_amplitude: 1.0
  max_rank: 15
  artificial_damping: 1.0
  num_modes: 3
  noise_mode: gaussian

plots:
  - x_param: max_rank
    style_mode: "single"
    output_path: figures/scans/outputs/paper_max_rank.pdf
    # title: "Effect of Max Rank on Order Detection"