# Multi-parameter scan example (L=1, no delays)
# Self-contained example using relative paths

base:
  csv_path: figures/scans/data/no_delays_combined_results.csv
  metric: order_hit_prob
  methods:
    - BIC
    - GAP
    - ESR-Energy
    - NestedDMD
    - FixedEigenvalueBVFit

  show: false

# Working point for L=1 (no delays) experiments
baseline_working_point:
  snr_db: 10.0
  freq_sep: 0.01
  eig_mag: 0.98
  eig_mag_spread: 0.0
  delays_over_timesteps: 0.005
  spatial_dim: 220
  temporal_dim: 200
  rho_mode: random
  max_rank: 15
  artificial_damping: 1.0
  num_modes: 3
  noise_mode: gaussian
  top_amplitude: 1.0

plots:
  - x_params: [snr_db, freq_sep, eig_mag]
    output_path: figures/scans/outputs/multi_param_scan_L1.pdf
    title: "Standard DMD Order Detection Scans $(L=1)$"
