# Design Configuration - Static styling choices
# This file is rarely touched

# Method styling (fixed colors, linestyles, and markers)
# Convention: Our methods use circles (o), comparison methods use triangles (^)
methods:
  ESL-Norm:
    color: '#00008B'
    linestyle: '-'
    marker: 'o'
  FixedEigenvalueBVFit:
    color: '#5DADE2'
    linestyle: '-'
    marker: 'o'
  NestedDMD:
    color: '#4682B4'
    linestyle: '-'
    marker: 'o'
  AIC:
    color: '#8B0000'
    linestyle: '--'
    marker: '^'
  BIC:
    color: '#CD5C5C'
    linestyle: '--'
    marker: '^'
  ExactModeNorm:
    color: '#FF6347'
    linestyle: '--'
    marker: '^'
  GAP:
    color: '#FF8C00'
    linestyle: '--'
    marker: '^'
  STC:
    color: '#FFD700'
    linestyle: '--'
    marker: '^'
  AICc:
    color: '#FFA500'
    linestyle: '--'
    marker: '^'

# Figure dimensions
figure:
  panel_width: 8
  panel_height: 4
  dpi: 150

# Line styling
lines:
  linewidth: 2
  markersize: 5

# Labels
labels:
  fontsize: 10
  title_fontsize: 14

# Legend
legend:
  fontsize: 9
  framealpha: 0.9

# Defaults for unknown methods
defaults:
  color: '#999999'
  linestyle: ':'
  marker: 'o'

# Parameter label mappings (overrides auto-formatting)
# Define consistent, proper labels for your parameters globally
# Supports LaTeX notation with $ delimiters
# These are used automatically unless overridden in individual plots
parameter_labels:
  snr_db: "SNR (dB)"
  eig_mag: "Damping parameter $r$"
  freq_sep: "$\\Delta f$"
  top_amplitude: "$b_{\\mathrm{max}} / b_{\\mathrm{min}}$"
  order_hit_prob: "$P_{\\mathrm{hit}}$"
  num_modes: "Number of Modes"
  noise_mode: "Noise Type"
  temporal_dim: "Temporal Dimension"
  spatial_dim: "Spatial Dimension"
  # Add more parameter mappings as needed

