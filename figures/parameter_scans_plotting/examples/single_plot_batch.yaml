# Comprehensive scan generation
# Uses baseline_working_point to avoid repetition
#
# Marker convention (defined in design_config.yaml):
#   Our methods (ESL-Norm, FixedEigenvalueBVFit, NestedDMD): circles (o)
#   Comparison methods (BIC, GAP, STC): triangles (^)

base:
  csv_path: C:\Users\Yoav\dcdmd_experiments\161125\combined_results.csv
  metric: order_hit_prob
  methods:
#    - AIC
    - BIC
    - GAP
#    - ExactModeNorm
    - STC
    - ESL-Norm
    - NestedDMD
    - FixedEigenvalueBVFit

  show: false


# Baseline working point - shared across all plots
# Individual plots only override what differs
baseline_working_point:
  snr_db: 10.0
  freq_sep: 0.01
  eig_mag: 0.98
  eig_mag_spread: 0.0
  rho_mode: random
  delays_over_timesteps: 0.32
  temporal_dim: 200
  spatial_dim: 45
  top_amplitude: 1.0
  max_rank: 10
  artificial_damping: 1.0
  num_modes: 5
  noise_mode: gaussian

plots:
  - x_param: snr_db
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\snr_db.png
#    title: "Order Hit Probability vs. SNR"

  - x_param: freq_sep
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\freq_sep.png
#    title: "Order Hit Probability vs. Frequency Separation"

  - x_param: eig_mag
    xlim: [0.87, 1.0]
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\eig_mag.png
#    title: "Order Hit Probability vs. Eigenvalue Magnitude"

  - x_param: spatial_dim
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\spatial_dim.png
#    title: "Order Hit Probability vs. Spatial Dimension"

  - x_param: delays_over_timesteps
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\delays_over_timesteps.png
#    title: "Order Hit Probability vs. Delays/Timesteps"

  - x_param: top_amplitude
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\top_amplitude.png
#    title: "Order Hit Probability vs. Top Amplitude"

  - x_param: max_rank
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_m=5\max_rank.png
#    title: "Order Hit Probability vs. Max Rank"
