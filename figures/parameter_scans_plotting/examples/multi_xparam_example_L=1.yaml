# Multi-Parameter X-Axis Example
# Creates multi-panel plots where each panel varies a different x-axis parameter
# This is useful for comparing sensitivity across different parameters

base:
  csv_path: 'C:\Users\Yoav\dcdmd_experiments\exp_281125_no_delays\combined_results.csv'
  metric: order_hit_prob
  methods:
    - BIC
    - GAP
    - ESL-Norm

  show: false

# Baseline working point - shared across all plots
# NOTE: Even though these parameters appear in x_params, their values are still needed:
#   1. For cross-panel filtering (e.g., when varying snr_db, we filter by freq_sep=0.01)
#   2. For the working point vertical line on each panel
baseline_working_point:
  snr_db: 10.0
  freq_sep: 0.01
  eig_mag: 0.98
  eig_mag_spread: 0.0
  delays_over_timesteps: 0.005
  spatial_dim: 220
  temporal_dim: 200
  rho_mode: random
  max_rank: 15
  artificial_damping: 1.0
  num_modes: 3
  noise_mode: gaussian
  top_amplitude: 1.0

plots:
  # Example 1: Three parameters - SNR, Frequency Separation, Eigenvalue Magnitude
  - x_params: [snr_db, freq_sep, eig_mag]
    output_path: C:\Users\Yoav\dcdmd_experiments\exp_281125_no_delays\figures\3_params.png

    title: "Standard DMD Order Detection Scans $(L=1)$"
