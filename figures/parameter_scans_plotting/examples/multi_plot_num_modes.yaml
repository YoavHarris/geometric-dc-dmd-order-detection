# Comprehensive scan generation
# Uses baseline_working_point to avoid repetition

base:
  csv_path: C:\Users\Yoav\dcdmd_experiments\161125\combined_results.csv
  metric: order_hit_prob
  methods:
#    - AIC
    - BIC
    - GAP
#    - ExactModeNorm
    - STC
    - ESL-Norm
    - NestedDMD
    - FixedEigenvalueBVFit
  panel_param: num_modes
  panel_values: [2, 3, 5]
  
  generate_auc: true        # Generate AUC tables (CSV + image)
  auc_normalize: true       # Normalize for multi-panel comparison

  show: false


# Baseline working point - shared across all plots
# Individual plots only override what differs
baseline_working_point:
#  snr_db: 10.0
#  freq_sep: 0.01
#  eig_mag: 0.98
  eig_mag_spread: 0.0
  rho_mode: random
  delays_over_timesteps: 0.32
  temporal_dim: 200
  spatial_dim: 45
#  top_amplitude: 1.0
  max_rank: 10
  artificial_damping: 1.0
  noise_mode: gaussian

plots:
  - working_point: {freq_sep: 0.01, eig_mag: 0.98, top_amplitude: 1.0}
    x_param: snr_db

    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_reformatted\snr_db.png
    title: "Order Hit Probability vs. SNR (Gaussian Noise)"

  - working_point: {snr_db: 10.0, eig_mag: 0.98, top_amplitude: 1.0}
    x_param: freq_sep
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_reformatted\freq_sep.png
    title: "Order Hit Probability vs. Frequency Separation (Gaussian Noise)"

  - working_point: {snr_db: 10.0, freq_sep: 0.01, top_amplitude: 1.0}
    x_param: eig_mag
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_reformatted\eig_mag.png
    title: "Order Hit Probability vs. Eigenvalue Magnitude (Gaussian Noise)"

  - working_point: {snr_db: 10.0, freq_sep: 0.01, eig_mag: 0.98}
    x_param: top_amplitude
    output_path: C:\Users\Yoav\dcdmd_experiments\161125\scan_plots\gaussian_reformatted\top_amplitude.png
    title: "Order Hit Probability vs. Top Amplitude (Gaussian Noise)"
