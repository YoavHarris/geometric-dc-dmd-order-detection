# Example batch config with baseline working point

base:
  csv_path: ../../examples/combined_results_cleaned.csv
  metric: order_hit_prob
  panel_param: noise_mode
  panel_values: [gaussian, student_t, hetero, bi_gaussian]
  show: false

# Baseline working point - shared across all plots
# Individual plots only specify overrides
baseline_working_point:
  snr_db: 8.0                   # x_param reference for SNR scans
  freq_sep: 0.01
  eig_mag: 0.98
  eig_mag_spread: 0.0
  rho_mode: random
  delays_over_timesteps: 0.32
  temporal_dim: 200
  spatial_dim: 45
  top_amplitude: 1.0
  max_rank: 10
  artificial_damping: 1.0
  # noise_mode: NOT specified - it's the panel_param

plots:
  # SNR scan for num_modes=2
  # Only specify what differs from baseline
  - working_point:
      num_modes: 2
    x_param: snr_db
    output_path: output/snr_num_modes_2.png
    title: "Order Hit Probability vs. SNR (num_modes=2)"
  
  # SNR scan for num_modes=3
  - working_point:
      num_modes: 3
    x_param: snr_db
    output_path: output/snr_num_modes_3.png
    title: "Order Hit Probability vs. SNR (num_modes=3)"

