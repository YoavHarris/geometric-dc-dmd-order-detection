# Comprehensive scan generation
# Uses baseline_working_point to avoid repetition

base:
  csv_path: C:\Users\Yoav\dcdmd_experiments\111125_fixed\combined_results.csv
  metric: order_hit_prob
  methods:
    - AIC
    - BIC
    - GAP
#    - ExactModeNorm
    - STC
    - ESL-Norm
    - NestedDMD
    - FixedEigenvalueBVFit
    -
  panel_param: noise_mode
  panel_values: [gaussian, student_t, hetero, bi_gaussian]

  show: false


# Baseline working point - shared across all plots
# Individual plots only override what differs
baseline_working_point:
  snr_db: 8.0
  freq_sep: 0.01
  eig_mag: 0.98
  eig_mag_spread: 0.0
  rho_mode: random
  delays_over_timesteps: 0.32
  temporal_dim: 200
  spatial_dim: 45
  top_amplitude: 1.0
  max_rank: 10
  artificial_damping: 1.0

plots:
  # ===== SNR scans (snr_db varies on x-axis) =====
  - working_point: {num_modes: 2}
    x_param: snr_db
    output_path: C:\Users\Yoav\dcdmd_experiments\111125_fixed\scan_plots\snr_db_num_modes_2.png
#    title: "Order Hit Probability vs. SNR (num_modes=2)"

  - working_point: {num_modes: 3}
    x_param: snr_db
    output_path: C:\Users\Yoav\dcdmd_experiments\111125_fixed\scan_plots\snr_db_num_modes_3.png
    title: "Order Hit Probability vs. SNR (num_modes=3)"

  - working_point: {num_modes: 5}
    x_param: snr_db
    output_path: C:\Users\Yoav\dcdmd_experiments\111125_fixed\scan_plots\snr_db_num_modes_5.png
    title: "Order Hit Probability vs. SNR (num_modes=5)"

  # ===== Frequency separation scans =====
