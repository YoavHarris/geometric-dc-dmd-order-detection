# Design Configuration - Static styling choices
# This file is rarely touched

# Method styling (fixed colors and linestyles)
methods:
  ESL-Norm:
    color: '#00008B'
    linestyle: '-'
  FixedEigenvalueBVFit:
    color: '#5DADE2'
    linestyle: '-'
  NestedDMD:
    color: '#4682B4'
    linestyle: '-'
  AIC:
    color: '#8B0000'
    linestyle: '--'
  BIC:
    color: '#CD5C5C'
    linestyle: '--'
  ExactModeNorm:
    color: '#FF6347'
    linestyle: '--'
  GAP:
    color: '#FF8C00'
    linestyle: '--'
  STC:
    color: '#FFD700'
    linestyle: '--'
  AICc:
    color: '#FFA500'
    linestyle: '--'

# Figure dimensions
figure:
  panel_width: 8
  panel_height: 4
  dpi: 150

# Line styling
lines:
  linewidth: 2
  markersize: 5

# Labels
labels:
  fontsize: 10
  title_fontsize: 14

# Legend
legend:
  fontsize: 9
  framealpha: 0.9

# Defaults for unknown methods
defaults:
  color: '#999999'
  linestyle: ':'

# Parameter label mappings (overrides auto-formatting)
# Define consistent, proper labels for your parameters globally
# Supports LaTeX notation with $ delimiters
# These are used automatically unless overridden in individual plots
parameter_labels:
  snr_db: "SNR (dB)"
  eig_mag: "$|\\lambda|$"
  freq_sep: "$\\Delta f$"
  max_amplitude: "$b_{\\mathrm{max}} / b_{\\mathrm{min}}$"
  order_hit_prob: "$P_{\\mathrm{hit}}$"
  num_modes: "Number of Modes"
  noise_mode: "Noise Type"
  temporal_dim: "Temporal Dimension"
  spatial_dim: "Spatial Dimension"
  # Add more parameter mappings as needed

