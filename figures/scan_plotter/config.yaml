# Design Configuration - Static styling choices
# This file is rarely touched

# Method styling (fixed colors and linestyles)
methods:
  ESL-Norm:
    color: '#00008B'
    linestyle: '-'
  FixedEigenvalueBVFit:
    color: '#5DADE2'
    linestyle: '-'
  NestedDMD:
    color: '#4682B4'
    linestyle: '-'
  AIC:
    color: '#8B0000'
    linestyle: '--'
  BIC:
    color: '#CD5C5C'
    linestyle: '--'
  ExactModeNorm:
    color: '#FF6347'
    linestyle: '--'
  GAP:
    color: '#FF8C00'
    linestyle: '--'
  STC:
    color: '#FFD700'
    linestyle: '--'
  AICc:
    color: '#FFA500'
    linestyle: '--'

# Figure dimensions
figure:
  panel_width: 8
  panel_height: 4
  dpi: 150

# Line styling
lines:
  linewidth: 2
  markersize: 5

# Labels
labels:
  fontsize: 10
  title_fontsize: 14

# Legend
legend:
  fontsize: 9
  framealpha: 0.9

# Defaults for unknown methods
defaults:
  color: '#999999'
  linestyle: ':'

